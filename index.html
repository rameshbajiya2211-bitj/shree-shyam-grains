<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shree Shyam Grains</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fffbea;color:#124c35}
header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;background:white;position:sticky;top:0}
.logo{font-size:28px;font-weight:800}.sub{color:#a87919;letter-spacing:5px;font-size:14px}
.btn{background:#14833b;color:white;padding:14px 20px;border-radius:10px;text-decoration:none;font-weight:700}
.hero{padding:55px 6%;text-align:center}.hero h1{font-size:52px;margin:15px 0}.hero p{font-size:20px;color:#333}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:30px 6%}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 15px #0002}.card img{width:100%;height:240px;object-fit:cover}.card h2{padding:0 18px}
.gallery{padding:30px 6%}.gallery img{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin:12px 0}
footer{text-align:center;padding:35px;background:#124c35;color:white}
</style>
</head>
<body>
<header><div><div class="logo">🌾 SHREE SHYAM</div><div class="sub">GRAINS</div></div>
<a class="btn" href="https://wa.me/" target="_blank">WhatsApp</a></header>
<section class="hero">
<div>PREMIUM QUALITY • RAJASTHAN</div>
<h1>Indian Grains<br>for a Better Tomorrow</h1>
<p>Moth &nbsp; | &nbsp; Moong &nbsp; | &nbsp; Bajra</p>
<p>Cleaned • Sorted • Bulk Supply • Domestic & Export Enquiries</p>
<a class="btn" href="https://wa.me/" target="_blank">Get Quote on WhatsApp →</a>
</section>
<section class="products">
<div class="card"><img src="moth.jpg"><h2>Moth Beans</h2></div>
<div class="card"><img src="moong.jpg"><h2>Moong</h2></div>
<div class="card"><img src="bajra.jpg"><h2>Bajra</h2></div>
</section>
<section class="gallery"><img src="warehouse.jpg" alt="Shree Shyam Grains warehouse"></section>
<footer>© Shree Shyam Grains • Rajasthan</footer>
</body>
</html>
